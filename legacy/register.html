<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | FoodShare</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/lucide@latest"></script></head><body data-page="register"><div class="site-nav"></div><main class="auth-wrap"><div class="auth-card reveal"><a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="leaf"></i></span>FoodShare</a><h1>Join the movement.</h1><p>Choose how you want to make a difference with FoodShare.</p><div class="alert"></div><form id="authForm"><div class="form-group"><label for="name">FULL NAME / ORGANIZATION</label><input id="name" name="name" type="text" placeholder="Your name or organization" required></div><div class="form-group"><label for="email">EMAIL ADDRESS</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div><div class="form-grid"><div class="form-group"><label for="role">I AM A</label><select id="role" name="role"><option>Donor</option><option>Recipient</option><option>Admin</option></select></div><div class="form-group"><label for="password">PASSWORD</label><input id="password" name="password" type="password" placeholder="Create password" required></div></div><button class="btn btn-primary" type="submit">Create account <i data-lucide="arrow-right"></i></button></form><p class="auth-foot">Already part of the movement? <a href="login.html">Log in</a></p></div></main><script src="script.js"></script></body></html>
